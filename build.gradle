plugins {
    id 'fabric-loom' version '1.16.3'
    id 'java'
}

version = '1.0.5'
group = 'net.kanieoutis'

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net' }
    maven { url 'https://repo.maven.apache.org/maven2' }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    mappings "net.fabricmc:yarn:1.21.11+build.3:v2"
    modImplementation "net.fabricmc:fabric-api:0.141.6+1.21.11"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets {
    main {
        java {
            srcDirs = ['src/net/kanieoutis/seiunac', 'src/stubs']
        }
        resources {
            srcDirs = ['assets', '.']
            include 'seiunac.mixins.json'
            include 'fabric.mod.json'
        }
    }
}
